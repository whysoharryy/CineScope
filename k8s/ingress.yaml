apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinescope-ingress
  namespace: cinescope
  labels:
    app: cinescope-frontend
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: cinescope.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cinescope-service
                port:
                  number: 80
