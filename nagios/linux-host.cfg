###############################################################################
# NAGIOS CONFIGURATION: Linux Host Monitoring (via NRPE & Standard Plugins)
# File: nagios/linux-host.cfg
# Description: Centralized monitoring of Linux nodes, ports, disk, and CPU load
###############################################################################

define host {
    use                     linux-server
    host_name               linux-prod-node
    alias                   Ubuntu/Debian Kubernetes Worker Node
    address                 192.168.1.100       ; Replace with actual Linux IP
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

# 1. Ping / Network Connectivity Check
define service {
    use                     generic-service
    host_name               linux-prod-node
    service_description     PING Status
    check_command           check_ping!100.0,20%!500.0,60%
}

# 2. SSH Port 22 Availability
define service {
    use                     generic-service
    host_name               linux-prod-node
    service_description     SSH Port 22 Service
    check_command           check_ssh
    notifications_enabled   1
}

# 3. CPU Load Average (via NRPE agent)
define service {
    use                     generic-service
    host_name               linux-prod-node
    service_description     CPU Load Average
    check_command           check_nrpe!check_load
}

# 4. Root Disk Space / (via NRPE agent)
define service {
    use                     generic-service
    host_name               linux-prod-node
    service_description     Root Partition Disk Usage
    check_command           check_nrpe!check_disk
}

# 5. Total Running Processes (via NRPE agent)
define service {
    use                     generic-service
    host_name               linux-prod-node
    service_description     Total Processes
    check_command           check_nrpe!check_total_procs
}

# Command definition for check_nrpe
define command {
    command_name            check_nrpe
    command_line            $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}
