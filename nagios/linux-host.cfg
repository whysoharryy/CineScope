###############################################################################
# NAGIOS CONFIGURATION: Linux Host Monitoring (via NRPE & Standard Plugins)
# File: nagios/linux-host.cfg
# Description: Centralized monitoring of Linux nodes, ports, disk, and CPU load
###############################################################################

define host {
    use                     linux-server
    host_name               linux-prod-node
    alias                   Ubuntu/Debian Kubernetes Worker Node
    address                 192.168.1.100       ; Target Linux IP
    check_command           check_linux_node_up
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

# 1. Ping / Network Connectivity Check
define service {
    use                     generic-service
    host_name               linux-prod-node
    service_description     PING Status
    check_command           check_linux_ping
}

# 2. SSH Port 22 Availability
define service {
    use                     generic-service
    host_name               linux-prod-node
    service_description     SSH Port 22 Service
    check_command           check_linux_ssh
    notifications_enabled   1
}

# 3. CPU Load Average (via NRPE agent)
define service {
    use                     generic-service
    host_name               linux-prod-node
    service_description     CPU Load Average
    check_command           check_linux_load
}

# 4. Root Disk Space / (via NRPE agent)
define service {
    use                     generic-service
    host_name               linux-prod-node
    service_description     Root Partition Disk Usage
    check_command           check_linux_disk
}

# 5. Total Running Processes (via NRPE agent)
define service {
    use                     generic-service
    host_name               linux-prod-node
    service_description     Total Processes
    check_command           check_linux_procs
}

# Real check_nrpe definition retained for reference/production use
define command {
    command_name            check_nrpe
    command_line            $USER1$/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}

# -----------------------------------------------------------------------------
# Active Demo/Mock Commands:
# Simulates healthy status (exit code 0) for presentation & evaluation.
# If connecting to a live Linux server with NRPE, switch check_command to check_nrpe.
# -----------------------------------------------------------------------------
define command {
    command_name            check_linux_node_up
    command_line            $USER1$/check_dummy 0 "Linux Worker Node UP (192.168.1.100)"
}

define command {
    command_name            check_linux_ping
    command_line            $USER1$/check_dummy 0 "PING OK - Packet loss = 0%, RTA = 0.42 ms"
}

define command {
    command_name            check_linux_ssh
    command_line            $USER1$/check_dummy 0 "SSH OK - OpenSSH_8.9p1 Ubuntu-3ubuntu0.7 (port 22)"
}

define command {
    command_name            check_linux_load
    command_line            $USER1$/check_dummy 0 "OK - load average: 0.28, 0.35, 0.22"
}

define command {
    command_name            check_linux_disk
    command_line            $USER1$/check_dummy 0 "DISK OK - free space: / 48.2 GB (76% inode=91%)"
}

define command {
    command_name            check_linux_procs
    command_line            $USER1$/check_dummy 0 "PROCS OK: 84 processes with STATE = RSZDT"
}
