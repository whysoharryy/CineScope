###############################################################################
# NAGIOS CONFIGURATION: Windows Host Monitoring (via NCPA / NSClient++)
# File: nagios/windows-host.cfg
# Description: Centralized monitoring of Windows Server/Client, CPU, RAM, & Disks
###############################################################################

define host {
    use                     generic-host
    host_name               windows-prod-node
    alias                   Windows Production Server / Node
    address                 192.168.1.101       ; Replace with actual Windows IP
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    contact_groups          admins
}

# 1. Host Alive Check (PING)
define service {
    use                     generic-service
    host_name               windows-prod-node
    service_description     Ping Connectivity
    check_command           check_ping!100.0,20%!500.0,60%
}

# 2. Windows CPU Utilization (Warning 80%, Critical 90%)
define service {
    use                     generic-service
    host_name               windows-prod-node
    service_description     CPU Utilization
    check_command           check_nt!CPULOAD!-l 5,80,90
}

# 3. Windows Memory Usage (RAM)
define service {
    use                     generic-service
    host_name               windows-prod-node
    service_description     Memory Usage
    check_command           check_nt!MEMUSE!-w 80 -c 90
}

# 4. Windows C:\ Drive Space
define service {
    use                     generic-service
    host_name               windows-prod-node
    service_description     C: Drive Space
    check_command           check_nt!USEDDISKSPACE!-l c -w 80 -c 90
}

# 5. Windows Remote Desktop Service (Port 3389)
define service {
    use                     generic-service
    host_name               windows-prod-node
    service_description     RDP Port 3389 Check
    check_command           check_tcp!3389
}
