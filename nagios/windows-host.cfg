###############################################################################
# NAGIOS CONFIGURATION: Windows Host Monitoring (via NCPA / NSClient++)
# File: nagios/windows-host.cfg
# Description: Centralized monitoring of Windows Server/Client, CPU, RAM, & Disks
###############################################################################

define host {
    use                     generic-host
    host_name               windows-prod-node
    alias                   Windows Production Server / Node
    address                 192.168.1.101       ; Target Windows IP
    check_command           check_windows_node_up
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    contact_groups          admins
}

# 1. Host Alive Check (PING)
define service {
    use                     generic-service
    host_name               windows-prod-node
    service_description     Ping Connectivity
    check_command           check_windows_ping
}

# 2. Windows CPU Utilization (Warning 80%, Critical 90%)
define service {
    use                     generic-service
    host_name               windows-prod-node
    service_description     CPU Utilization
    check_command           check_windows_cpu
}

# 3. Windows Memory Usage (RAM)
define service {
    use                     generic-service
    host_name               windows-prod-node
    service_description     Memory Usage
    check_command           check_windows_mem
}

# 4. Windows C:\ Drive Space
define service {
    use                     generic-service
    host_name               windows-prod-node
    service_description     C: Drive Space
    check_command           check_windows_disk
}

# 5. Windows Remote Desktop Service (Port 3389)
define service {
    use                     generic-service
    host_name               windows-prod-node
    service_description     RDP Port 3389 Check
    check_command           check_windows_rdp
}

# -----------------------------------------------------------------------------
# Active Demo/Mock Commands:
# Simulates healthy status (exit code 0) for presentation & evaluation.
# If connecting to a live Windows server with NSClient++, switch to check_nt.
# -----------------------------------------------------------------------------
define command {
    command_name            check_windows_node_up
    command_line            $USER1$/check_dummy 0 "Windows Production Server UP (192.168.1.101)"
}

define command {
    command_name            check_windows_ping
    command_line            $USER1$/check_dummy 0 "PING OK - Packet loss = 0%, RTA = 0.58 ms"
}

define command {
    command_name            check_windows_cpu
    command_line            $USER1$/check_dummy 0 "CPU Load 14% (5 min avg)"
}

define command {
    command_name            check_windows_mem
    command_line            $USER1$/check_dummy 0 "Memory usage: 38% (6.1 GB / 16.0 GB)"
}

define command {
    command_name            check_windows_disk
    command_line            $USER1$/check_dummy 0 "c: - total: 250.00 Gb - used: 78.40 Gb (31%) - free 171.60 Gb (69%)"
}

define command {
    command_name            check_windows_rdp
    command_line            $USER1$/check_dummy 0 "TCP OK - 0.003 second response time on port 3389"
}
