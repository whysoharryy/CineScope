###############################################################################
# NAGIOS CONFIGURATION: CineScope Kubernetes Service Monitoring
# File: nagios/cinescope.cfg
# Description: Defines host and service checks for CineScope frontend on K8s
###############################################################################

# Define Host for CineScope Kubernetes Cluster / Ingress Entry
define host {
    use                     linux-server
    host_name               cinescope-app
    alias                   CineScope React-NGINX Kubernetes Cluster
    address                 host.docker.internal  ; Use 127.0.0.1 if running Nagios natively on Linux host
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

# 1. Monitor TCP Port 8080 (CineScope Service Port)
define service {
    use                     generic-service
    host_name               cinescope-app
    service_description     CineScope TCP Port 8080
    check_command           check_tcp!8080
    notifications_enabled   1
}

# 2. Monitor HTTP / Endpoint (Root Landing Page)
define service {
    use                     generic-service
    host_name               cinescope-app
    service_description     CineScope Web HTTP 200 OK
    check_command           check_http!-p 8080 -u / -e "HTTP/1.1 200"
    notifications_enabled   1
}

# 3. Monitor Kubernetes Liveness / Readiness Healthz Endpoint
define service {
    use                     generic-service
    host_name               cinescope-app
    service_description     CineScope Healthz Probe
    check_command           check_http!-p 8080 -u /healthz -s "healthy"
    notifications_enabled   1
}
